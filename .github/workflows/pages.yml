name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy mid-flight: two overlapping deploys race on the
# single Pages artifact.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # corepack makes the yarn pinned in package.json the yarn that runs. Do
      # not use setup-node's `cache: yarn`: it probes with yarn 1.x first.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # Builds the site and the Pagefind search index into dist/.
      - name: Build
        run: yarn build

      # public/CNAME binds the custom domain. If it goes missing Pages unbinds
      # software-factory.vulnetix.com, which looks like DNS but is not.
      - name: Verify the custom domain survived the build
        run: |
          test -f dist/CNAME || { echo "dist/CNAME missing"; exit 1; }
          grep -qx 'software-factory.vulnetix.com' dist/CNAME || { echo "dist/CNAME mismatch:"; cat dist/CNAME; exit 1; }

      - name: Check internal links
        run: node scripts/check-links.mjs dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
